name: Skill validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and template checks (offline)
        run: python -m unittest discover -s tests -v
      - name: Check CV template structure
        run: python scripts/validate_report.py assets/academic-cv-template.docx --template
      - name: Confirm expected author/DOI mistakes are rejected
        run: |
          if python scripts/verify_publications.py tests/fixtures/goldstone_cases.json > regression-results.json; then
            echo 'Expected known-error fixture to fail, but script succeeded'; exit 1
          fi
          python -m json.tool regression-results.json > /dev/null
